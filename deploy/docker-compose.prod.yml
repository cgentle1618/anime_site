# Production, on the homelab box. Run from the repository root:
#
#   docker compose -f deploy/docker-compose.prod.yml <command>
#
# or through deploy/deploy.sh, which takes a dump before it pulls. How this is
# operated, what is in .env, and how to roll back are in deploy/README.md.
#
# The docker-compose.yml at the repository root is a DIFFERENT thing: it runs a
# bare PostgreSQL for local development and nothing else. Keeping production
# here rather than there is what stops the two colliding.
#
# Relative paths below are relative to this file's directory, so `..` is the
# repository root.

services:
  db:
    image: postgres:17
    container_name: anime_site_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose's own interpolation, so the shell inside the
      # container expands these rather than compose expanding them here.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: dockerfile
    # Named even though it is built here, so moving to a registry later is a
    # change to what this name points at rather than a restructure.
    image: anime-site-app:local
    container_name: anime_site_prod_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # entrypoint.sh binds ${PORT:-8080}; the ingress routes to app:8000.
      PORT: 8000
    volumes:
      # Bind mounts, not named volumes, so rsync and the backup see ordinary
      # files. static/library/ is the only copy of every uploaded image there
      # is - it cannot be re-fetched the way covers can.
      - ../static/covers:/app/static/covers
      - ../static/library:/app/static/library
    depends_on:
      db:
        # Without this, a boot where PostgreSQL is slower than the app makes
        # the app crash-loop through `alembic upgrade head` until it wins.
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: anime_site_prod_cloudflared
    restart: unless-stopped
    # --no-autoupdate: the image is the unit of upgrade here, and an in-place
    # self-update would restart the tunnel outside anyone's knowledge.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run ${TUNNEL_ID}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS}:/etc/cloudflared/credentials.json:ro
    depends_on:
      - app

volumes:
  pgdata:
